name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The hashed lockfile is the deploy artifact; install from it with
          # --require-hashes so CI fails on lockfile drift, exactly like the
          # Docker build does.
          pip install --require-hashes --only-binary=:all: -r requirements.lock.txt
          pip install pytest pytest-asyncio httpx 'moto[s3,server]' mypy

      - name: Ruff
        run: pipx run ruff==0.16.6 check .

      - name: Mypy ratchet (new type errors are rejected; fix and run
            scripts/mypy_ratchet.py --regenerate to tighten the baseline)
        run: python scripts/mypy_ratchet.py

      - name: Verify lockfile matches requirements.txt
        # Dependabot bumps requirements.txt but cannot regenerate the hashed
        # lockfile; without this check a stale lockfile would silently keep
        # the Docker build on old versions.
        run: |
          python - <<'PY'
          import re, sys
          pins = dict(re.findall(r'^([\w-]+)==([\w.]+)(?:\s*;[^#\n]*)?$', open('requirements.txt').read(), re.M))
          lock = open('requirements.lock.txt').read()
          stale = []
          for name, ver in pins.items():
              m = re.search(rf'(?mi)^{re.escape(name)}==([\w.]+)\b', lock)
              if m is None or m.group(1) != ver:
                  stale.append((name, ver, m.group(1) if m else 'ABSENT'))
          for name, req_ver, lock_ver in stale:
              print(f'STALE LOCKFILE: {name} requirements.txt={req_ver} lock={lock_ver}')
          sys.exit(1 if stale else 0)
          PY

      - name: Run tests
        run: pytest -q
